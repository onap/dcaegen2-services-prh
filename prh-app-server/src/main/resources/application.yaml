spring:
  application:
    name: dcae-prh

logging:
  level:
    org.springframework.boot.SpringApplication: warn
    org.springframework.context.support.PostProcessorRegistrationDelegate: warn

# CBS bootstrap configuration (formerly in bootstrap.yaml, read by the Spring Cloud
# bootstrap context). PRH now fetches CBS config directly at startup, so these live here.
cbs:
  app-name: dcae-prh
  updates-interval: 5m
  fetch-retries:
    max-attempts: 10
    first-backoff: 3s
    max-backoff: 15s

---
spring:
  config:
    activate:
      on-profile: prod

server:
  port: 8433
  ssl:
    key-store-type: PKCS12
    key-store-password: nokiapnf
    key-store: classpath:keystore-local
    key-password: nokiapnf
    keyAlias: tomcat-localhost

management.endpoints.web.exposure.include: "loggers,refresh,env,health"

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.onap.dcaegen2.services.prh: debug
    org.onap.dcaegen2.services.sdk: debug

management.endpoints.web.exposure.include: "*"

---
spring:
  profiles:
    default: prod
